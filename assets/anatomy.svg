<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="t d">
  <title id="t">Anatomía de una tarjeta cubana</title>
  <desc id="d">Los dígitos 1 y 2 son la red RED, el 3 y el 4 el producto y la moneda, del 5 al 8 el banco, del 9 al 15 la cuenta y el 16 el dígito de control Luhn.</desc>
