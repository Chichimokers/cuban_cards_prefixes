      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d98b"/>
      <stop offset="1" stop-color="#c9a24a"/>
    </linearGradient>
    <clipPath id="cardclip"><rect x="40" y="30" width="800" height="186" rx="20"/></clipPath>
  </defs>
  <rect width="880" height="360" rx="22" fill="#0b1220"/>
